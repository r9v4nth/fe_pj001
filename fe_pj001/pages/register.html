<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account - AX</title><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/login.css"></head><body><main class="page-center"><section class="card auth-card"><div class="brand auth-brand"><div class="brand-mark">AX</div><div class="brand-name">AX</div></div><h1 class="auth-title">Create your account</h1><p class="auth-subtitle">Join AX and start chatting</p><form id="registerForm"><div class="form-group"><label class="form-label" for="fullName">Full Name</label><input class="input" id="fullName" type="text" placeholder="Enter your full name" required></div><div class="form-group"><label class="form-label" for="registerUsername">Username</label><input class="input" id="registerUsername" type="text" placeholder="Choose a username" required></div><div class="form-group"><label class="form-label" for="registerPassword">Password</label><input class="password-input" id="registerPassword" type="password" placeholder="Create a password" required></div><div class="form-group"><label class="form-label" for="confirmPassword">Confirm Password</label><input class="password-input" id="confirmPassword" type="password" placeholder="Confirm your password" required></div><button class="button" type="submit">Create Account</button><p id="registerMessage" class="message" aria-live="polite"></p></form><div class="auth-footer">Already have an account? <a href="login.html">Login</a></div></section></main><script src="../js/config.js"></script><script src="../js/api.js"></script><script>const f=document.getElementById('registerForm'),m=document.getElementById('registerMessage');f.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('registerPassword').value,c=document.getElementById('confirmPassword').value;if(p!==c){m.className='message error';m.textContent='Passwords do not match.';return}m.className='message info';m.textContent='Creating account...';try{const r=await apiRequest('/register',{method:'POST',body:JSON.stringify({name:document.getElementById('fullName').value.trim(),username:document.getElementById('registerUsername').value.trim(),password:p})});if(r.ok){m.className='message success';m.textContent='Account created. Redirecting to login...';setTimeout(()=>location.href='login.html',800)}else{m.className='message error';m.textContent=r.data?.detail||'Could not create account.'}}catch(err){console.error(err);m.className='message error';m.textContent='Could not connect to backend.'}})</script></body></html>
