<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - AX</title><link rel="stylesheet" href="../css/global.css"><link rel="stylesheet" href="../css/login.css"></head><body><main class="page-center"><section class="card auth-card"><div class="brand auth-brand"><div class="brand-mark">AX</div><div class="brand-name">AX</div></div><h1 class="auth-title">Welcome back</h1><p class="auth-subtitle">Sign in to continue to AX</p><form id="loginForm"><div class="form-group"><label class="form-label" for="username">Username</label><input class="input" id="username" type="text" autocomplete="username" placeholder="Enter your username" required></div><div class="form-group"><label class="form-label" for="password">Password</label><div class="input-wrap"><input class="password-input" id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="password-toggle" type="button" data-target="password" aria-label="Show or hide password">

</button></div></div><div class="auth-options"><label class="remember"><input type="checkbox" id="remember"> Remember me</label><a href="#" onclick="return false;">Forgot password?</a></div><button class="button" type="submit">Login</button><p id="message" class="message" aria-live="polite"></p></form><div class="auth-divider"><span>or</span></div><div class="auth-footer">Don't have an account? <a href="register.html">Create account</a></div></section></main><script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script></body></html>
